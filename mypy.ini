# mypy: the Python type checker, run by CI (.github/workflows/ci.yml, job
# "typecheck"). Run it from the repository root, with the backend installed as
# in CI and types-PyYAML next to mypy:
#     mypy
# It checks backend/, LLM_preprocessor/ and RAG/, the same folders ruff checks
# (ruff.toml). The tests and RAG/tools/ are left out until they are clean;
# ingest/ and benchmarks/ can be added after that.

[mypy]
python_version = 3.12
files = backend, LLM_preprocessor, RAG
exclude = (?x)(
    (^|/)tests/
    | ^RAG/tools/
  )

# The code imports these folders as top-level modules ("from services import
# ...", "import preprocess", "import retriever"). backend/, RAG/,
# LLM_preprocessor/ and BIDS-SQL/ are pip-installed editable, but mypy cannot
# follow the import hooks of setuptools' editable installs, so it is given the
# folders here. The crawler is on the path for its tests and for
# RUN_CRAWLER_IN_PROCESS.
mypy_path = $MYPY_CONFIG_FILE_DIR/backend,
            $MYPY_CONFIG_FILE_DIR/LLM_preprocessor,
            $MYPY_CONFIG_FILE_DIR/RAG,
            $MYPY_CONFIG_FILE_DIR/BIDS-SQL,
            $MYPY_CONFIG_FILE_DIR/ingest/openneuro-crawler
explicit_package_bases = True

# Settings classes (pydantic-settings) read their fields from the environment,
# so calling them without arguments is fine.
plugins = pydantic.mypy

warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

# ── Code from elsewhere: use its types, don't report its errors here ─────────

# BIDS-SQL is its own repository (a git submodule).
[mypy-db.*,settings,rules,utils,input_pipeline]
follow_imports = silent

# The crawler is outside the checked folders for now.
[mypy-remote.*,post_crawl,crawler_service]
follow_imports = silent

# Libraries without type information.
[mypy-pandas.*,starlette_csrf.*,sentence_transformers.*,psycopg2.*]
ignore_missing_imports = True
