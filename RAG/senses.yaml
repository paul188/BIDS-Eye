# Senses of ambiguous topic words (RAG/senses.py).
#
# A head word such as "conflict" means different things in different studies:
# conflict between people, response conflict in a Stroop task, an
# approach-avoidance conflict. A qualifier in the question ("social conflict")
# picks one sense. The picked sense adds its search phrases and task codes,
# and the distinctive words of the other senses become meanings the search
# does not want (they move a dataset down, never out).
#
# Per head, per sense:
#   cues          question words that pick this sense (matched as whole words)
#   alternatives  phrases authors use for this sense; searched close together
#   tasks         task codes (value_mappings.yaml) that stand for this sense
#   marks         words or phrases that show a text is about this sense;
#                 used to exclude it when another sense was asked for
#
# Keep entries to domain knowledge. Do not add a phrase because a benchmark
# question needs it (benchmarks/recall/held_out_questions.txt).
# scripts/mine_senses.py lists the words that occur next to a head in the
# catalogue, as material for new entries.

conflict:
  social:
    cues: [social, interpersonal, intergroup, couple, couples, partner, partners, family, marital, group, groups, political]
    # Not "discrimination" alone: in this catalogue it is mostly perceptual discrimination.
    alternatives: [interpersonal conflict, intergroup conflict, couple conflict, family conflict, marital conflict,
                   aggression, provocation, hostility, disagreement, negotiation, social exclusion, ostracism,
                   cyberball, group discrimination]
    tasks: []
    marks: [interpersonal conflict, intergroup conflict, aggression, provocation]
  cognitive:
    cues: [cognitive, response, stimulus, interference, executive, attentional, stroop, simon, flanker]
    alternatives: [response conflict, conflict monitoring, conflict adaptation, interference control,
                   stroop, simon task, flanker]
    tasks: [simon_task, flanker_task_ern, flanker_task_condition_a, flanker_task_condition_b, flanker_task_condition_c]
    marks: [stroop, simon, flanker, response conflict, conflict monitoring, conflict adaptation, stimulus-response]
  emotional:
    cues: [emotional, affective]
    alternatives: [emotional conflict, emotional stroop]
    tasks: [emotional_conflict_task]
    marks: [emotional conflict, emotional stroop]
  decision:
    cues: [approach-avoidance, approach, avoidance, decision, decisional, motivational]
    alternatives: [approach-avoidance conflict, decision conflict]
    tasks: [approach_avoidance_conflict]
    marks: [approach-avoidance, decision conflict]

