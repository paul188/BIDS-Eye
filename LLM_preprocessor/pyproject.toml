# LLM_preprocessor/: the question's preprocessing (preprocess/) and the model
# client (llm_client.py).
#
# Installed editable, like BIDS-SQL (Dockerfile, CI, local setup in README.md):
#   pip install -e RAG -e LLM_preprocessor
# The backend then imports `preprocess` and `llm_client` without adding this
# folder to sys.path itself.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bids-eye-llm-preprocessor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bids-eye-rag",
    "pydantic>=2.0",
]

[tool.setuptools]
py-modules = ["llm_client"]
packages = ["preprocess"]
