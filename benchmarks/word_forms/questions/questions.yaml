# Question-level test set for word forms (README.md next to this file).
#
# For each question:
#   search_words      words of the question the user wants matched in a dataset's text
#   filler_words      words of the question that have a word-form decision (a labelled pair, the
#                     reviewed list or the stored pairs) but are request language, not search words
#   truth             per search word: whether a search for it should also find the other forms
#                     ("other"). "by" names the pair of the blind label set
#                     (../label_set.json, labels ../labels_p000-p189_chrome_2026-11-19.json);
#                     "overridden" marks a question whose sense differs from the label (note says why).
#                     Pairs labelled "context" are not scored.
#   must_look_up      (tier trap) words question_words() must return
#   must_not_look_up  (tier trap) tokens it must not return (fragments of a word)
#
# Tiers: labelled (a form of a labelled pair occurs), reviewed_list (a word of word_forms.yaml or
# word_form_pairs.json, no labelled form), control (neither), trap (written for tokenization).
# Questions come from the development split of benchmarks/recall/queries.yaml,
# benchmarks/demand/demand_queries.yaml, benchmarks/easy/easy_searches.yaml and
# benchmarks/recall/ambiguity_queries.yaml; held-out questions are left out.
# search_words were judged by Claude (2026-11-27) and await Paul's review.
