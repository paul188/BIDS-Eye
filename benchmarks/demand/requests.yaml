# Real dataset requests, turned into search questions.
#
# Every entry is something a person actually asked for or stated as a
# selection rule: a forum post, a feature request, or the dataset-selection
# criteria in a paper's methods. Sources and verbatim quotes come from
# docs/research/Neuroimaging dataset search criteria/ (forum_requests.md,
# paper_selection_criteria.md), collected 2026-11-14.
#
# Fields
#   id        qf = forum request, qx = request for a search capability,
#             qp = selection criteria stated in a paper
#   ref       the id used in the research notes (N1…, S1…, X1…) or the paper
#   url       where it was asked
#   quote     the request in the person's own words (typos kept)
#   question  the same need as a search question, in the person's vocabulary.
#             "open / public" is dropped: everything in the catalogue is open.
#   criteria  which kinds of constraint the question carries (names below)
#   in_scope  false when OpenNeuro cannot hold such data (CT, PNG exports…);
#             a good answer is then "nothing", not a long list
#   needs     the evidence a correct answer depends on
#
# Criteria names (the ranking is in docs/research/Neuroimaging dataset search criteria.md):
#   modality, task, rest, stimulus (what was shown or played), design (block,
#   run order, randomisation), population (a diagnosis or group), healthy,
#   controls (patients AND a control group), age, sex, species, sample_size,
#   subgroup_count (a count over a subset of participants), sessions,
#   derivatives, pipeline (a named pipeline or version), acquisition (field
#   strength, TR, sequence, voxel size, sampling rate, vendor, phase encoding),
#   cooccurrence (two kinds of scan in the same subject or session),
#   auxiliary (physio, electrode positions, stimulus files), amount (duration,
#   trials, GB), phenotype (a questionnaire or score is shared), labels
#   (ground truth for machine learning), licence, format, bids_valid, quality,
#   linked_paper, like_dataset (anchored on a named dataset), region,
#   exclusion (something must be absent), numeric (a threshold with a number)

requests:

