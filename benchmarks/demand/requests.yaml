# ── Dataset-selection criteria stated in papers ────────────────────────────────
- {id: qp01_t1w_and_bold_per_subject, ref: "Esteban 2019 (fMRIPrep)", url: "https://doi.org/10.1038/s41592-018-0235-4",
   quote: "only datasets including at least one T1-weighted (T1w) and one BOLD per subject run were included",
   question: "datasets where every subject has at least one T1w and one BOLD run",
   criteria: [modality, cooccurrence], needs: "per-subject file tree"}
- {id: qp02_t1w_five_adult_hc, ref: "Fisch 2026 (deepmriprep)", url: "https://doi.org/10.1038/s43588-026-00953-7",
   quote: "each dataset that contained at least five T1w MRIs from at least five adult HCs was included",
   question: "datasets with T1w MRI from at least five adult healthy controls",
   criteria: [modality, healthy, age, subgroup_count, numeric], needs: "count of participants who are healthy AND adult AND have a T1w"}
- {id: qp03_t1w_healthy_children_2_12, ref: "Fisch 2026 (OpenNeuro-Kids)", url: "https://doi.org/10.1038/s43588-026-00953-7",
   quote: "each dataset that contained at least 5 T1w MRIs from at least 5 HCs in the age range from 2 to 12 years was included",
   question: "datasets with T1w MRI from at least 5 healthy controls aged 2 to 12 years",
   criteria: [modality, healthy, age, subgroup_count, numeric], needs: "count of participants who are healthy AND aged 2–12 AND have a T1w"}
- {id: qp04_3t_mprage_age_5_21_no_pmc, ref: "Bricout 2026", url: "https://doi.org/10.3389/fnins.2026.1817743",
   quote: "Includes at least one subject between 5 and 21. Field strength should be three Tesla. Acquisition protocol should be similar to MPRAGE. No prospective motion correction techniques (e.g., vNavs).",
   question: "3 Tesla MPRAGE datasets with at least one subject between 5 and 21 years old, without prospective motion correction such as vNavs",
   criteria: [modality, acquisition, age, exclusion, numeric], needs: "MagneticFieldStrength; sequence name; participant ages; absence of vNav/PMC"}
- {id: qp05_rest_epi_t1w_same_session_tr, ref: "Taylor 2023 (FMRI QC)", url: "https://doi.org/10.3389/fnins.2023.1205928",
   quote: "Having >12 subjects, each of whom has at least one EPI and one T1w volume in the same session directory. EPI: TR > 1.5 s, all voxel edges < 4.1 mm, number of volumes > 100",
   question: "resting state collections with more than 12 subjects, each with an EPI and a T1w in the same session, EPI TR above 1.5 s and voxels smaller than 4.1 mm",
   criteria: [modality, rest, sample_size, cooccurrence, acquisition, numeric], needs: "subject count; per-session file tree; RepetitionTime; voxel size from the NIfTI header"}
- {id: qp06_language_50_healthy_adults_descriptor, ref: "Rampinini 2025 (NEBULA101)", url: "https://doi.org/10.1038/s41597-024-04357-y",
   quote: "a search on http://openneuro.org for BIDS-valid MRI raw/derivative datasets with more than 50 healthy adults, including the keyword 'language' and accompanied by a published or pre-registered data descriptor",
   question: "BIDS-valid MRI datasets on language with more than 50 healthy adults and a published data descriptor",
   criteria: [modality, task, healthy, age, subgroup_count, bids_valid, linked_paper, numeric], needs: "topic is language (the authors found ds004215 and ds000243 matched the keyword but 'have no relationship with language'); healthy adult count; a linked paper"}
- {id: qp07_isolated_words, ref: "Denissen 2024 (HED LANG)", url: "https://doi.org/10.1038/s41597-024-04282-0",
   quote: "We selected fMRI datasets for experiments presenting isolated words.",
   question: "fMRI datasets for experiments presenting isolated words",
   criteria: [modality, stimulus], needs: "stimulus description (single words, not sentences or stories)"}
- {id: qp08_eating_disorders_mri, ref: "Tanaka 2024", url: "https://doi.org/10.1111/pcn.13717",
   quote: "Search by 'disease name + MRI' in data repositories such as OpenNeuro ... Keywords used for the search were eating disorders, anorexia nervosa, bulimia nervosa, binge-eating disorder, and MRI.",
   question: "eating disorders MRI",
   criteria: [modality, population], needs: "participants with anorexia, bulimia or binge-eating disorder"}
- {id: qp09_eeg_stress, ref: "Chatzaki 2025", url: "https://doi.org/10.3390/s25237108",
   quote: "For the search on OpenNeuro, the modality of EEG was chosen and combined with the keywords describing the affective condition.",
   question: "EEG stress",
   criteria: [modality, task], needs: "EEG; stress induction or stress as the studied state"}
- {id: qp10_task_fmri_with_paper, ref: "Bowring 2019", url: "https://doi.org/10.1002/hbm.24603",
   quote: "we vetted the associated publication for each dataset stored in the repository ... selected on the basis that they reported clearly defined regions of brain activation",
   question: "task fMRI datasets with an associated publication that reports group-level activation results",
   criteria: [modality, task, linked_paper], needs: "a primary paper linked to the dataset; task fMRI"}
- {id: qp11_memory_consolidation, ref: "Bartzioka 2026", url: "https://doi.org/10.1016/j.ynirp.2026.100398",
   quote: "Datasets were selected based on their alignment with the consolidation clusters described above, together with task metadata completeness, preprocessing compatibility, and sufficient sample size.",
   question: "fMRI datasets on memory consolidation with complete task events and a sufficient sample size",
   criteria: [modality, task, quality, sample_size], needs: "topic memory consolidation; events files present; subject count"}
- {id: qp12_normative_healthy, ref: "Isherwood 2021", url: "https://doi.org/10.1371/journal.pone.0248341",
   quote: "had to be normative, that is, made up of individuals that were reported as healthy at the time of scanning ... a collection of curated images … acquired to be of similar composition",
   question: "normative MRI databases made up only of healthy individuals",
   criteria: [modality, healthy, exclusion], needs: "all participants healthy (no patient group)"}
- {id: qp13_bci_paradigms, ref: "Chevallier 2024 (MOABB)", url: "https://arxiv.org/html/2404.15319v1",
   quote: "we chose to restrict to three common BCI paradigms, namely MI, ERP, and SSVEP",
   question: "EEG datasets with motor imagery, ERP or SSVEP paradigms",
   criteria: [modality, task], needs: "EEG; BCI paradigm (MI = motor imagery)"}
- {id: qp14_eeg_200hz_redistributable, ref: "Shahi 2026 (EEGDash)", url: "https://arxiv.org/html/2611.06356v1",
   quote: "Recordings of 10 seconds or less, or sampled below 200 Hz, are skipped ... small brain–computer-interface sets under no-derivatives licences, which forbid a converted copy",
   question: "EEG datasets sampled at 200 Hz or higher under a licence that allows redistributing converted copies",
   criteria: [modality, acquisition, licence, numeric], needs: "SamplingFrequency in the EEG sidecars; licence"}
