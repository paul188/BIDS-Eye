   quote: "Would like see NHP added into species list",
   question: "NHP datasets",
   criteria: [species], needs: "species label; NHP = non-human primate"}
- {id: qx11_bids_filename, ref: X7, url: "https://github.com/OpenNeuroOrg/openneuro/issues/3983",
   quote: "it would be useful to have a BIDS-aware filename search across all public datasets.",
   question: "datasets containing files that end in _desc-preproc_bold.nii.gz",
   criteria: [derivatives, format], needs: "file names inside derivatives"}
- {id: qx12_metadata_sheet, ref: X5, url: "https://neurostars.org/t/is-there-any-compilation-of-the-metadata-from-most-different-neuro-data-repositories/27562",
   quote: "The entry would include wherever applicable modality, dataset size, organism, n_subjects, ages, condition(s), duration, brain region, license, authors, paper",
