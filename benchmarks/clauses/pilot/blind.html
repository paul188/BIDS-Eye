<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clause pilot</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--mute:#666;--line:#ddd;--card:#f7f7f5;--acc:#0b6b58}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e8e8e6;--mute:#9a9a98;--line:#333;--card:#1f2225;--acc:#5cc6ab}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin:14px 0;background:var(--card)}
.text{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}.mute{color:var(--mute);font-size:13px}
code{font-size:14px;overflow-wrap:anywhere}table{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}td{padding:2px 8px 2px 0;vertical-align:top}
button,label.r{font:inherit;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;margin:2px}
label.r:has(input:checked){border-color:var(--acc);color:var(--acc)}textarea{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
</style>
<h1>Clause pilot</h1><p id="intro"></p><p><span id="count"></span> <button id="dl">Download answers</button></p><div id="list"></div>
<script>
const MODE="blind",ITEMS=[{"id": "own-01", "set": "own", "text": "EEG datasets with a motor imagery task, but no resting-state recording"}, {"id": "own-02", "set": "own", "text": "iEEG recordings with neither scalp EEG nor MEG"}, {"id": "own-03", "set": "own", "text": "depression, not bipolar, resting-state fMRI"}, {"id": "own-04", "set": "own", "text": "epilepsy datasets except temporal lobe epilepsy"}, {"id": "own-05", "set": "own", "text": "T2-weighted and FLAIR images, anything but 7T"}, {"id": "own-06", "set": "own", "text": "fMRI of reading, not collected in the US"}, {"id": "own-07", "set": "own", "text": "unmedicated depression patients with resting-state fMRI"}, {"id": "own-08", "set": "own", "text": "drug-naive first-episode psychosis, T1w"}, {"id": "own-09", "set": "own", "text": "MRI-negative epilepsy patients with stereo-EEG"}, {"id": "own-10", "set": "own", "text": "fMRI of a working memory task in non-smokers"}, {"id": "own-11", "set": "own", "text": "task fMRI other than resting state"}, {"id": "own-12", "set": "own", "text": "resting-state fMRI from healthy volunteers only"}, {"id": "own-13", "set": "own", "text": "T1w scans free of motion artefacts"}, {"id": "own-14", "set": "own", "text": "fMRI in people with chronic pain, free of depression, anxiety or substance use"}, {"id": "own-15", "set": "own", "text": "adults with no history of stroke, head injury, seizures; structural MRI"}, {"id": "own-16", "set": "own", "text": "EEG in autism without intellectual disability and epilepsy"}, {"id": "own-17", "set": "own", "text": "schizophrenia patients lacking comorbid depression, substance abuse or epilepsy; T1w"}, {"id": "own-18", "set": "own", "text": "not only EEG but also fNIRS from the same subjects"}, {"id": "own-19", "set": "own", "text": "non-invasive brain stimulation (TMS or tDCS) with EEG"}, {"id": "own-20", "set": "own", "text": "fMRI with a go/no-go or stop-signal task, no larger than 30 GB"}, {"id": "own-21", "set": "own", "text": "MEG of speech perception, language does not matter; besides that, a T1w scan"}, {"id": "own-22", "set": "own", "text": "any public brain signals (fMRI, EEG, fNIRS...) of people after Covid-19?"}, {"id": "own-23", "set": "own", "text": "open TOF/SWI images, field strength doesn't matter"}, {"id": "own-24", "set": "own", "text": "T1w; diffusion; resting-state fMRI"}, {"id": "own-25", "set": "own", "text": "anorexia nervosa, bulimia nervosa, binge-eating disorder; MRI"}, {"id": "own-26", "set": "own", "text": "EEG of normal people as well as those suffering from Alzheimer's"}, {"id": "own-27", "set": "own", "text": "resting-state fMRI, healthy controls, with alcohol consumption or dependence questionnaires (AUDIT, ADS, etc.)"}, {"id": "own-28", "set": "own", "text": "at least one T1w and one BOLD run per subject"}, {"id": "own-29", "set": "own", "text": "resting-state fMRI and EEG in older adults"}, {"id": "own-30", "set": "own", "text": "T1 and T2 weighted images from stroke patients over 60"}, {"id": "own-31", "set": "own", "text": "I need fMRI with some decoding task: block design, 4 or more subjects (more is fine), several sessions each, localizer ok; no RS"}, {"id": "own-32", "set": "own", "text": "fMRI, rest then task then rest again, all on one day. Kind of task doesn't matter"}, {"id": "own-33", "set": "own", "text": "Hello, for a student project we need 7T rs-fMRI plus an anatomical acquired as MPRAGE (not MP2RAGE), humans only. We already looked at HCP."}, {"id": "own-34", "set": "own", "text": "anyone know of data with both a language task in fMRI and DTI? I'm using HCP so far, would prefer something smaller"}, {"id": "own-35", "set": "own", "text": "Diffusion data from tumor patients, ideally with T1w as well; no paediatric cases please, thanks!"}, {"id": "own-36", "set": "own", "text": "3T, MPRAGE-like, at least one participant aged 5-21, without prospective motion correction (vNavs etc.)"}, {"id": "own-37", "set": "own", "text": "datset epilepsi patients + APT or CEST, min 20 subjcts, no animals pls"}, {"id": "own-38", "set": "own", "text": "datasets with Alzheimer's patients, or any sleep EEG"}, {"id": "own-39", "set": "own", "text": "at least two of: T1w, T2w, diffusion, ASL"}, {"id": "own-40", "set": "own", "text": "Parkinson's patients over 65, controls under 40, gait task"}, {"id": "own-41", "set": "own", "text": "resting-state EEG; leave out any dataset with epilepsy patients, sleep recordings or TMS"}, {"id": "own-42", "set": "own", "text": "language production: fMRI, MEG, ECoG, any of these"}, {"id": "own-43", "set": "own", "text": "hi! looking for movie-watching fMRI with eye tracking, 30 or more subjects; preprocessed or raw, both fine. thanks"}, {"id": "own-44", "set": "own", "text": "for a meta-analysis: stroke or aphasia patients, diffusion MRI, nothing below 10 subjects"}, {"id": "ch-01", "set": "chia", "text": "Any other primary DSM-IV diagnosis; DSM-IV criteria for body dysmorphic disorder, bipolar affective disorder, schizophrenia, psychotic disorder, current alcohol/substance abuse.", "header": "exclusion"}, {"id": "ch-02", "set": "chia", "text": "Received heart transplantation or pacemaker implantation; revascularization treatment within 3 months; or plan to receive above treatment in 6 months.", "header": "exclusion"}, {"id": "ch-03", "set": "chia", "text": "Comorbidities such as uncontrolled cardiovascular disease, i.e., unstable systemic arterial hypertension, coronary artery disease; previous stroke; OSA; pneumothorax in the last 2 months.", "header": "exclusion"}, {"id": "ch-04", "set": "chia", "text": "hypoglycemia SE;psychogenic SE;any other pseudo-SE", "header": "exclusion"}, {"id": "ch-05", "set": "chia", "text": "(1)Women who are pregnant and/or lactating; or women who intend to conceive within a year;", "header": "exclusion"}, {"id": "ch-06", "set": "chia", "text": "Have other metallic artifacts/components in body that may interact with MRI", "header": "exclusion"}, {"id": "ch-07", "set": "chia", "text": "Subject has cauda equina syndrome or neurogenic bowel/bladder dysfunction.", "header": "exclusion"}, {"id": "ch-08", "set": "chia", "text": "Presence of psychiatric disorder or intake of anti-depressive or anti-psychotic agents with the exception of benzodiazepines and SSRIs/SNRI's (selective serotonin reuptake inhibitor)", "header": "exclusion"}, {"id": "ch-09", "set": "chia", "text": "Contraindication of MRI Claustrophobia Metallic hazards Pacemaker implant eGFR<30 ml/min", "header": "exclusion"}, {"id": "ch-10", "set": "chia", "text": "Psychiatrically stable enough to attend to completion (no hospitalisations or medication changes in last 4 weeks)", "header": "inclusion"}, {"id": "ch-11", "set": "chia", "text": "No concurrent use of other investigational drugs or antineoplastic therapies.", "header": "exclusion"}, {"id": "ch-12", "set": "chia", "text": "9. No pain(including dysmenorrhea) or drug use (e.g., antipyretics,sleeping pills) within the last month", "header": "inclusion"}, {"id": "ch-13", "set": "chia", "text": "Males or non-pregnant, non-nursing females", "header": "inclusion"}, {"id": "ch-14", "set": "chia", "text": "2. Sex: Male and non-pregnant, non-lactating female", "header": "inclusion"}, {"id": "ch-15", "set": "chia", "text": "Women of Childbearing potential without proper contraceptive measures, pregnancy or breast feeding", "header": "exclusion"}, {"id": "ch-16", "set": "chia", "text": "Evidence of any GI disorder induced by an infection, underlying medical condition, or concomitant medication other than MPA", "header": "exclusion"}, {"id": "ch-17", "set": "chia", "text": "History of seizures (this criterion does not apply to subjects who have had a single, uncomplicated febrile convulsion in the past) or neurological disease.", "header": "exclusion"}, {"id": "ch-18", "set": "chia", "text": "Patients who were pregnant, nursing or not able to give written informed consent were excluded.", "header": "exclusion"}, {"id": "ch-19", "set": "chia", "text": "2. Unavailability of brain MRI (in case of absolute contraindications, the use of cranial CT is allowed).", "header": "exclusion"}, {"id": "ch-20", "set": "chia", "text": "High-grade block in the absence of a functioning pacemaker.", "header": "exclusion"}, {"id": "ch-21", "set": "chia", "text": "Patients with a history of hypothyroidism unless taking a stable dose of thyroid medication and asymptomatic or euthyroid for 6 months;", "header": "exclusion"}, {"id": "ch-22", "set": "chia", "text": "Weight loss drugs other than metformin", "header": "exclusion"}, {"id": "ch-23", "set": "chia", "text": "not taking medications other than oral contraceptives", "header": "inclusion"}, {"id": "ch-24", "set": "chia", "text": "History of a seizure disorder other than a single childhood febrile seizure.", "header": "exclusion"}, {"id": "ch-25", "set": "chia", "text": "Patients taking antipsychotics, mood stabilizer or any psychotropic medications besides antidepressants, except benzodiazepines or beta blockers or hypnotics", "header": "exclusion"}, {"id": "ch-26", "set": "chia", "text": "Patients with a current seizure disorder, organic brain disorder or a history of seizure disorders (except for febrile seizures in childhood).", "header": "exclusion"}, {"id": "ch-27", "set": "chia", "text": "Primary in-utero drug exposure was opioids other than buprenorphine", "header": "inclusion"}, {"id": "ch-28", "set": "chia", "text": "Patients on chronic (longer than the prior 6 months) anticoagulation other than with antiplatelet medications;", "header": "exclusion"}, {"id": "ch-29", "set": "chia", "text": "DSM-IV-TR substance-related disorders (except nicotine)", "header": "exclusion"}, {"id": "ch-30", "set": "chia", "text": "Allergy to used drugs (PEG, neomycin, metronidazole)", "header": "exclusion"}, {"id": "ch-31", "set": "chia", "text": "Compromised neurologic status on exam (specifically assessment of radial, ulnar, and median nerve)", "header": "exclusion"}, {"id": "ch-32", "set": "chia", "text": "If a female of child-bearing potential, must have a negative pregnancy test.", "header": "inclusion"}, {"id": "ch-33", "set": "chia", "text": "no history of allergy to drugs such as, but not limited to, sulphonamides and penicillins", "header": "exclusion"}, {"id": "ch-34", "set": "chia", "text": "Current therapy with Insulin, thiazolidinediones, steroids or atypical antipsychotic medication", "header": "exclusion"}, {"id": "ch-35", "set": "chia", "text": "Subjects with cognitive, psychiatric, or other problems that preclude informed consent.", "header": "exclusion"}, {"id": "ch-36", "set": "chia", "text": "patients who have suffered a neurologic event (seizure, stroke) or who have baseline dementia, both of which could limit delirium assessment", "header": "exclusion"}, {"id": "ch-37", "set": "chia", "text": "Stroke or Transient Ischemic Attack (TIA) within the past 6 months or any permanent residual neurological defect", "header": "exclusion"}, {"id": "ch-38", "set": "chia", "text": "Subject with a history of myocardial infarction, stroke or life-threatening arrhythmia within 6 months prior to screening", "header": "exclusion"}, {"id": "ch-39", "set": "chia", "text": "Stroke or coronary revascularization in the past 6 months.", "header": "exclusion"}, {"id": "ch-40", "set": "chia", "text": "Any diagnosed cardiovascular, pulmonary, neurological, and/ or orthopedic conditions that would interfere with subject participation", "header": "exclusion"}],KEY="clause-pilot-"+MODE;let A={};try{A=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("intro").textContent=MODE=="review"
 ?"Is the drafted logic right? & = and, | = or, ! = not, a - b = a except b (some a that is not b). For Chia lines the inclusion or exclusion heading is not part of the logic. Answers stay in this browser until you download them."
 :"Write the logic you read in each text: name the clauses with the words of the text and join them with & | ! - (a - b = a except b) and brackets. Write a second line if the text has a second sensible reading. Answers stay in this browser until you download them.";
const words=w=>Array.isArray(w)?w.join(" … "):w;
function save(){try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}
 document.getElementById("count").textContent=Object.values(A).filter(a=>a.v||a.t).length+" of "+ITEMS.length+" answered"}
const list=document.getElementById("list");
for(const it of ITEMS){const d=document.createElement("div");d.className="card";const a=A[it.id]||(A[it.id]={});
 let h=`<div class="mute">${esc(it.id)}${MODE=="review"?" · "+esc(it.block)+" · "+esc(it.source)+(it.revised?" · <b>revised</b>":""):""}${it.header?" · "+esc(it.header)+" list":""}</div><div class="text">${esc(it.text)}</div>`;
 if(MODE=="review"){h+="<table>"+Object.entries(it.clauses).map(([k,c])=>`<tr><td><b>${esc(k)}</b></td><td>${c.field?esc(c.field)+": "+esc(c.values.join(" / ")):""} ${c.strength=="wish"||c.strength=="example"?"("+c.strength+")":""}</td><td>“${esc(words(c.words))}”</td><td class="mute">${c.attach&&c.attach!="dataset"?esc(c.attach):""}</td></tr>`).join("")+"</table>";
  h+=it.readings.map((r,i)=>`<div><span class="mute">reading ${i+1}${r.representable?" · plan can hold it: "+esc(r.representable):""}</span> <code>${esc(r.tree)}</code> <span class="mute">${esc(r.why||"")}</span></div>`).join("");
  if(it.attach_alternatives)h+=`<div class="mute">other attachment: ${esc(it.attach_alternatives.join("; "))}</div>`;
  if(it.note)h+=`<div class="mute">${esc(it.note)}</div>`;
  h+="<div>"+["right","wrong","ambiguous","unsure"].map(v=>`<label class="r"><input type="radio" name="${it.id}" value="${v}" ${a.v==v?"checked":""}> ${v}</label>`).join("")+"</div>"}
 h+=`<textarea rows="${MODE=="review"?1:3}" placeholder="${MODE=="review"?"correction or comment":'e.g. A = “EEG”, B = “resting state”: A & !B'}">${esc(a.t||"")}</textarea>`;
 d.innerHTML=h;d.addEventListener("input",e=>{if(e.target.type=="radio")a.v=e.target.value;else a.t=e.target.value;save()});list.append(d)}
save();document.getElementById("dl").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({mode:MODE,answers:A},null,1)],{type:"application/json"}));
 const l=document.createElement("a");l.href=u;l.download="clause_pilot_"+MODE+".json";l.click()};
</script></html>
