# 40 requests with gold clauses. DRAFT by an LLM (Claude), not reviewed.
# Format and rules: README.md. c1: [field, values, op, words, attach?, strength?]
# tree: & and, | or, ! not, a - b "a except b". Wishes stay out of the tree; a
# clause with strength example only illustrates another one. also: other trees of
# the same reading that a plan may use; they need not be the same logic.
items:
# ── explicit exclusion ──
- {id: own-01, block: explicit_exclusion, source: written, text: "EEG datasets with a motor imagery task, but no resting-state recording",
   clauses: {c1: [scan, [EEG], any, "EEG"], c2: [scan, [motor imagery], any, "motor imagery task"], c3: [scan, [resting state], any, "resting-state recording"]},
   readings: [{tree: "c1 & c2 & !c3", representable: yes}]}
- {id: own-02, block: explicit_exclusion, source: written, text: "iEEG recordings with neither scalp EEG nor MEG",
   clauses: {c1: [scan, [iEEG], any, "iEEG recordings"], c2: [scan, [scalp EEG, EEG], any, "scalp EEG"], c3: [scan, [MEG], any, "MEG"]},
   readings: [{tree: "c1 & !c2 & !c3", representable: yes}]}
- {id: own-03, block: explicit_exclusion, source: written, text: "depression, not bipolar, resting-state fMRI",
   clauses: {c1: [diagnosis, [depression], any, "depression"], c2: [diagnosis, [bipolar disorder], any, "bipolar"], c3: [scan, [resting state], any, "resting-state"], c4: [scan, [fMRI], any, "fMRI"]},
   readings: [{tree: "c1 & !c2 & c3 & c4", representable: yes}]}
- {id: own-04, block: explicit_exclusion, source: written, text: "epilepsy datasets except temporal lobe epilepsy",
   clauses: {c1: [diagnosis, [epilepsy], any, "epilepsy datasets"], c2: [diagnosis, [temporal lobe epilepsy], any, "temporal lobe epilepsy"]},
   readings: [{tree: "c1 & !c2", representable: yes, why: "a dataset with any TLE patient goes"}, {tree: "c1 - c2", representable: no, why: "a dataset with other epilepsies stays, also next to TLE"}], revised: true}
- {id: own-05, block: explicit_exclusion, source: written, text: "T2-weighted and FLAIR images, anything but 7T",
   clauses: {c1: [scan, [T2w], any, "T2-weighted"], c2: [scan, [FLAIR], any, "FLAIR"], c3: [sidecar, [MagneticFieldStrength 7], any, "7T"]},
   readings: [{tree: "c1 & c2 & !c3", representable: yes}, {tree: "(c1 | c2) & !c3", representable: yes, why: "and = union"}], attach_alternatives: ["c3 same_scan:c1,c2"], revised: true}
- {id: own-06, block: explicit_exclusion, source: written, text: "fMRI of reading, not collected in the US",
   clauses: {c1: [scan, [fMRI], any, "fMRI"], c2: [scan, [reading], any, "reading"], c3: [location, [United States], any, "the US"]},
   readings: [{tree: "c1 & c2 & !c3", representable: no, why: "no field for an excluded location"}]}
# ── hidden negation, single ──
- {id: own-07, block: hidden_single, source: written, text: "unmedicated depression patients with resting-state fMRI",
   clauses: {c1: [text, [unmedicated, medication-free, drug-free], any, "unmedicated", "group:1"], c2: [diagnosis, [depression], any, "depression patients", "group:1"], c3: [scan, [resting state], any, "resting-state"], c4: [scan, [fMRI], any, "fMRI"]},
   readings: [{tree: "c1 & c2 & c3 & c4", representable: yes}], convention: wanted_phrase}
- {id: own-08, block: hidden_single, source: written, text: "drug-naive first-episode psychosis, T1w",
   clauses: {c1: [text, [drug-naive, medication-naive, antipsychotic-naive], any, "drug-naive", "group:1"], c2: [diagnosis, [first-episode psychosis, psychosis], any, "first-episode psychosis", "group:1"], c3: [scan, [T1w], any, "T1w"]},
   readings: [{tree: "c1 & c2 & c3", representable: yes}], convention: wanted_phrase}
- {id: own-09, block: hidden_single, source: written, text: "MRI-negative epilepsy patients with stereo-EEG",
   clauses: {c1: [text, [MRI-negative, non-lesional], any, "MRI-negative", "group:1"], c2: [diagnosis, [epilepsy], any, "epilepsy patients", "group:1"], c3: [scan, [stereo-EEG, iEEG], any, "stereo-EEG"]},
   readings: [{tree: "c1 & c2 & c3", representable: yes}], convention: wanted_phrase}
- {id: own-10, block: hidden_single, source: written, text: "fMRI of a working memory task in non-smokers",
   clauses: {c1: [scan, [fMRI], any, "fMRI"], c2: [scan, [working memory], any, "working memory task"], c3: [text, [non-smokers, nonsmokers], any, "non-smokers"]},
   readings: [{tree: "c1 & c2 & c3", representable: yes}], convention: wanted_phrase}
- {id: own-11, block: hidden_single, source: written, text: "task fMRI other than resting state",
   clauses: {c1: [scan, [fMRI], any, "fMRI"], c2: [scan, [a task], any, "task"], c3: [scan, [resting state], any, "resting state"]},
   readings: [{tree: "c1 & c2 & !c3", representable: yes}, {tree: "c1 & c2", representable: yes, why: "only says which runs are meant"}]}
- {id: own-12, block: hidden_single, source: "rewritten from qf06", text: "resting-state fMRI from healthy volunteers only",
   clauses: {c1: [scan, [resting state], any, "resting-state"], c2: [scan, [fMRI], any, "fMRI"], c3: [population, [healthy], any, "healthy volunteers"], c4: [diagnosis, [any patient group], any, "only"]},
   readings: [{tree: "c1 & c2 & c3 & !c4", representable: no, why: "healthy adds no condition; 'no patients' has no field"}]}
- {id: own-13, block: hidden_single, source: written, text: "T1w scans free of motion artefacts",
   clauses: {c1: [scan, [T1w], any, "T1w scans"], c2: [text, [motion artefacts], any, "motion artefacts"]},
   readings: [{tree: "c1", representable: yes, why: "quality wish"}, {tree: "c1 & !c2", representable: yes}]}
# ── hidden negation over a list ──
- {id: own-14, block: hidden_list, source: written, text: "fMRI in people with chronic pain, free of depression, anxiety or substance use",
   clauses: {c1: [scan, [fMRI], any, "fMRI"], c2: [diagnosis, [chronic pain], any, "chronic pain", "group:1"], c3: [diagnosis, [depression], any, "depression"], c4: [diagnosis, [anxiety], any, "anxiety"], c5: [diagnosis, [substance use disorder, substance use], any, "substance use"]},
   readings: [{tree: "c1 & c2 & !c3 & !c4 & !c5", representable: yes}, {tree: "c1 & (c2 - (c3 | c4 | c5))", representable: no, why: "the same people"}], revised: true}
- {id: own-15, block: hidden_list, source: written, text: "adults with no history of stroke, head injury, seizures; structural MRI",
   clauses: {c1: [age, [adults], any, "adults"], c2: [diagnosis, [stroke], any, "stroke"], c3: [diagnosis, [head injury, traumatic brain injury], any, "head injury"], c4: [diagnosis, [seizures, epilepsy], any, "seizures"], c5: [scan, [structural MRI, T1w], any, "structural MRI"]},
   readings: [{tree: "c1 & !c2 & !c3 & !c4 & c5", representable: yes}]}
- {id: own-16, block: hidden_list, source: written, text: "EEG in autism without intellectual disability and epilepsy",
   clauses: {c1: [scan, [EEG], any, "EEG"], c2: [diagnosis, [autism], any, "autism", "group:1"], c3: [diagnosis, [intellectual disability], any, "intellectual disability"], c4: [diagnosis, [epilepsy], any, "epilepsy"]},
   readings: [{tree: "c1 & c2 & !c3 & !c4", representable: yes}, {tree: "c1 & c2 & !(c3 & c4)", representable: no, why: "only the combination is excluded"}, {tree: "c1 & (c2 - (c3 | c4))", representable: no, why: "the same people"}, {tree: "c1 & (c2 - (c3 & c4))", representable: no, why: "the same people, only the combination"}], revised: true}
- {id: own-17, block: hidden_list, source: written, text: "schizophrenia patients lacking comorbid depression, substance abuse or epilepsy; T1w",
   clauses: {c1: [diagnosis, [schizophrenia], any, "schizophrenia patients", "group:1"], c2: [diagnosis, [depression], any, "depression", "same_subject:c1"], c3: [diagnosis, [substance abuse], any, "substance abuse", "same_subject:c1"], c4: [diagnosis, [epilepsy], any, "epilepsy", "same_subject:c1"], c5: [scan, [T1w], any, "T1w"]},
   readings: [{tree: "(c1 - (c2 | c3 | c4)) & c5", representable: no, why: "comorbidity in one person; the plan excludes by dataset"}], revised: true}
# ── traps: look like a negation ──
- {id: own-18, block: trap, source: written, text: "not only EEG but also fNIRS from the same subjects",
   clauses: {c1: [scan, [EEG], any, "EEG", "same_subject:c2"], c2: [scan, [fNIRS], any, "fNIRS", "same_subject:c1"]},
   readings: [{tree: "c1 & c2", representable: yes}]}
- {id: own-19, block: trap, source: written, text: "non-invasive brain stimulation (TMS or tDCS) with EEG",
   clauses: {c1: [scan, [TMS], any, "TMS"], c2: [scan, [tDCS], any, "tDCS"], c3: [scan, [EEG], any, "EEG"], c4: [scan, [non-invasive brain stimulation], any, "non-invasive brain stimulation", dataset, optional]},
   readings: [{tree: "(c1 | c2) & c3", representable: yes, also: ["(c4 | c1 | c2) & c3"]}]}
- {id: own-20, block: trap, source: written, text: "fMRI with a go/no-go or stop-signal task, no larger than 30 GB",
   clauses: {c1: [scan, [fMRI], any, "fMRI"], c2: [scan, [go/no-go], any, "go/no-go"], c3: [scan, [stop-signal], any, "stop-signal"], c4: [size, [max 30 GB], any, "no larger than 30 GB"]},
   readings: [{tree: "c1 & (c2 | c3) & c4", representable: yes}]}
- {id: own-21, block: trap, source: written, text: "MEG of speech perception, language does not matter; besides that, a T1w scan",
   clauses: {c1: [scan, [MEG], any, "MEG"], c2: [scan, [speech perception], any, "speech perception"], c3: [scan, [T1w], any, "T1w scan"]},
   readings: [{tree: "c1 & c2 & c3", representable: yes}]}
# ── operators carried by punctuation ──
- {id: own-22, block: operators, source: "rewritten from qf16", text: "any public brain signals (fMRI, EEG, fNIRS...) of people after Covid-19?",
   clauses: {c1: [scan, [fMRI], any, "fMRI", dataset, example], c2: [scan, [EEG], any, "EEG", dataset, example], c3: [scan, [fNIRS], any, "fNIRS", dataset, example], c4: [diagnosis, [COVID-19], any, "Covid-19", "group:1"]},
   readings: [{tree: "c4", representable: yes, why: "any recording; the three are examples"}, {tree: "(c1 | c2 | c3) & c4", representable: yes}], revised: true}
- {id: own-23, block: operators, source: "rewritten from qf08", text: "open TOF/SWI images, field strength doesn't matter",
   clauses: {c1: [scan, [TOF], any, "TOF"], c2: [scan, [SWI], any, "SWI"]},
   readings: [{tree: "c1 | c2", representable: yes}, {tree: "c1 & c2", representable: yes}]}
- {id: own-24, block: operators, source: written, text: "T1w; diffusion; resting-state fMRI",
