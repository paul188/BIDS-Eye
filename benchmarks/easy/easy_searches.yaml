  - {id: e_mod_fmri_with,   question: "datasets with fMRI", check: {modality: [func]}, strict: true}
  - {id: e_mod_fmri_long,   question: "functional magnetic resonance imaging data", check: {modality: [func]}, strict: true}
  - {id: e_mod_bold,        question: "BOLD fMRI", check: {modality: [func]}, strict: true}
  - {id: e_mod_mri,         question: "show me all MRI datasets", check: {modality: [mri]}, strict: true}
  - {id: e_mod_anat,        question: "structural MRI datasets", check: {modality: [anat]}, strict: true}
