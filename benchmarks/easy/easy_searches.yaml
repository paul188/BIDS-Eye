# Easy searches: one or two plain criteria, as people type them on a dataset
# catalogue. The values are the common ones on OpenNeuro (its search filters:
# modality, diagnosis, task, species, age, sex, number of participants, study
# design, scanner, author, date).
#
# `check` reads a dataset's own labels (see ../openneuro_facets/compare.py and
# score_easy.py). Every dataset that passes it must be among the results.
# `strict: true` also requires every result to pass it; set only where the
# labels are complete enough for that (modality, species, size, author, year).
# No `check`: the search is recorded, and judged by a person.
queries:
