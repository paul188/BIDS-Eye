server {
    listen 80;
    server_name bidseye.xyz www.bidseye.xyz;

    # Let's Encrypt ACME challenge (certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bidseye.xyz www.bidseye.xyz;

    ssl_certificate     /etc/letsencrypt/live/bidseye.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bidseye.xyz/privkey.pem;

    # Docker's internal DNS — re-resolve upstream IPs every 10s so container
    # restarts are picked up without an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY"       always;
    add_header X-Content-Type-Options     "nosniff"    always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Report-only: the browser logs what the policy would block and blocks
    # nothing. Rename the header to Content-Security-Policy once the console
    # stays clean. The page loads only its own files and Google Fonts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Disallow indexing
    # (default_type, not add_header: an add_header here would drop the
    # security headers above for this response.)
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # FastAPI backend — longer timeouts because LLM calls can take ~30s
    location /api/ {
        # The largest body the API takes is a 2000-character question
        # (routers/schemas.py QueryRequest); even fully \u-escaped JSON stays
        # well under this. Set explicitly instead of relying on the 1m default.
        client_max_body_size 64k;
        set $upstream_api http://backend:8000;
        proxy_pass         $upstream_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue frontend (static files served by inner nginx container)
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass         $upstream_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
