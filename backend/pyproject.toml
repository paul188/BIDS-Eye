[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bids-eye-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The repo's other folders, installed first (README.md, Dockerfile):
    #   pip install -e ../BIDS-SQL -e ../RAG -e ../LLM_preprocessor
    "bids-sql",
    "bids-eye-rag",
    "bids-eye-llm-preprocessor",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Text-to-SQL pipeline (Gemini + RAG; Anthropic = cross-provider fallback tier)
    "google-genai>=0.8.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.0",
    "starlette-csrf>=3.0",
]

[project.optional-dependencies]
# Biomedical embedding fallback in RAG/retriever.py (BioLORD-2023-C + SapBERT)
# Install with: pip install -e ".[embeddings]"
embeddings = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
]

# The top-level modules other code imports by name (import schemas). main.py
# is left out: uvicorn and the tests load it from this folder.
[tool.setuptools]
py-modules = [
    "api_security",
    "constants",
    "deps",
    "models",
    "rate_limits",
    "schemas",
    "single_flight",
]

[tool.setuptools.packages.find]
where = ["."]
