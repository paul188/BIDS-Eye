[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bids-eye-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The repo's other folders, installed first (README.md, Dockerfile):
    #   pip install -e ../BIDS-SQL -e vocabulary -e llm
    "bids-sql",
    "bids-eye-rag",
    "bids-eye-llm-preprocessor",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Text-to-SQL pipeline (Gemini + RAG; Anthropic = cross-provider fallback tier)
    "google-genai>=0.8.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.0",
    "starlette-csrf>=3.0",
    # Schema migrations (migrations/README.md)
    "alembic>=1.13",
]

[project.optional-dependencies]
# Biomedical embedding fallback in backend/vocabulary/retriever.py (BioLORD-2023-C + SapBERT)
# Install with: pip install -e ".[embeddings]"
embeddings = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24",
]
# What the tests need on top (CI, README.md): pip install -e "backend[test]"
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "time-machine>=2.14",
]

# The top-level modules other code imports by name (import schemas). main.py
# is left out: uvicorn and the tests load it from this folder.
[tool.setuptools]
py-modules = [
    "deps",
    "models",
    "request_log",
    "schemas",
    "single_flight",
    "worker_db",
]

[tool.setuptools.packages.find]
where = ["."]
# vocabulary/ and llm/ are installed on their own (their pyproject.toml).
exclude = ["vocabulary*", "llm*"]

# pytest --cov, run from this folder: the backend and the two packages it is
# built on, without the tests themselves.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "*/tests/*"]
