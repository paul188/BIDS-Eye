name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scan only the commits this push or pull request adds. Without a
          # usable base (first push of a branch, forced push) scan everything.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="$range" --redact --no-banner .

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.4
      # The rules are in ruff.toml. crawlers/, scripts/ and benchmarks/ can be
      # added once they are clean.
      - run: ruff check backend LLM_preprocessor RAG

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    env:
      # mypy reads the installed packages' types: same versions as the image.
      PIP_CONSTRAINT: ${{ github.workspace }}/backend/constraints.txt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install as the backend image does
        run: |
          pip install -r BIDS-SQL/requirements.txt
          pip install -e BIDS-SQL
          pip install -e RAG -e LLM_preprocessor
          pip install -e backend
          pip install mypy==2.3.1 types-PyYAML==6.0.12.20261113
      # The folders and settings are in mypy.ini.
      - run: mypy

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Same pinned versions as the production image (backend/Dockerfile).
      PIP_CONSTRAINT: ${{ github.workspace }}/backend/constraints.txt
      # BIDS-SQL reads these at import. No test connects to a database.
      METADATA_DB_NAME: ci
      METADATA_DB_USER: ci
      METADATA_DB_PASSWORD: ci
      METADATA_DB_HOST: localhost
      METADATA_DB_PORT: "5432"
      SESSION_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      # The app refuses to start without the sign-in settings (routers/auth.py).
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci-only-not-a-secret
      ALLOW_ANY_GITHUB_USER: "true"
      # A scratch database for the tests that need real SQL
      # (tests/test_match_reasons_postgres.py); on its own port so nothing
      # finds it under METADATA_DB_*.
      BIDSEYE_TEST_PG_DSN: postgresql+asyncpg://postgres:ci@localhost:55439/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install as the backend image does
        run: |
          pip install -r BIDS-SQL/requirements.txt
          pip install -e BIDS-SQL
          pip install -e RAG -e LLM_preprocessor
          pip install -e backend
          pip install pytest time-machine
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests

  semgrep:
    name: Semgrep (new findings only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.178.0
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fails only on findings that the pushed commits introduce, so the
          # existing ones do not block. Without a usable base it lists all
          # findings and does not fail.
          # avoid-sqlalchemy-text is switched off: this project assembles SQL
          # text from constants on purpose and binds values as parameters, so
          # the rule flags nearly every query.
          args="--metrics=off --config p/python --config p/secrets"
          args="$args --exclude-rule python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text"
          paths="backend LLM_preprocessor RAG crawlers scripts frontend/src"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            semgrep scan $args --error --baseline-commit "$BASE" $paths
          else
            semgrep scan $args $paths
          fi

  frontend:
    name: Frontend lint, build, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24: runs the TypeScript tests without a build step (type stripping).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
